<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Intelligence</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 min-h-screen"><header class="bg-slate-950 text-white"><div class="max-w-6xl mx-auto px-6 py-5 flex justify-between"><div><h1 class="font-bold text-xl">Document Intelligence</h1><p class="text-xs text-slate-400">AI Business Automation</p></div><a href="/dashboard/" class="bg-slate-700 px-4 py-2 rounded-lg text-sm">Dashboard</a></div></header>
<main class="max-w-4xl mx-auto px-6 py-10"><div class="bg-white border rounded-2xl p-7"><h2 class="text-2xl font-bold">Upload & Analyze Document</h2><p class="text-slate-500 mt-1 mb-6">PDF, DOCX, TXT, CSV and supported document formats.</p><form id="docForm" class="space-y-4"><input id="file" type="file" required class="w-full border rounded-xl p-3"><button class="w-full bg-slate-950 text-white rounded-xl py-3 font-semibold">Analyze Document</button></form><div id="result" class="hidden mt-6 bg-slate-50 border rounded-xl p-5 whitespace-pre-wrap"></div></div></main>
<script>document.getElementById('docForm').addEventListener('submit',async e=>{e.preventDefault();const r=document.getElementById('result');r.className='mt-6 bg-slate-50 border rounded-xl p-5';r.textContent='Processing...';const f=new FormData();f.append('file',document.getElementById('file').files[0]);try{const x=await fetch('/documents/analyze',{method:'POST',body:f});const d=await x.json();if(!x.ok)throw new Error(d.detail||'Processing failed');r.textContent=JSON.stringify(d,null,2)}catch(err){r.textContent=err.message}});</script></body></html>
