<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | AI Business Automation</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                         BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.92);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
        }
    </style>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center relative overflow-hidden">

    <!-- Background -->
    <div class="absolute inset-0">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md px-6">

        <div class="glass rounded-3xl shadow-2xl p-8 border border-white/20">

            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 rounded-2xl bg-slate-950 flex items-center justify-center shadow-lg">
                    <span class="text-white text-2xl font-bold">AI</span>
                </div>
            </div>

            <!-- Heading -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-900">
                    Admin Login
                </h1>

                <p class="text-sm text-slate-500 mt-2">
                    AI Business Automation Platform
                </p>
            </div>

            {% if error %}
            <div class="mb-5 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
                {{ error }}
            </div>
            {% endif %}

            <!-- Form -->
            <form method="POST" action="/auth/login" class="space-y-5">

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="Enter admin username"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3
                               text-sm outline-none transition
                               focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="Enter admin password"
                        class="w-full rounded-xl border border-slate-300 px-4 py-3
                               text-sm outline-none transition
                               focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full rounded-xl bg-slate-950 py-3.5 text-sm
                           font-semibold text-white transition
                           hover:bg-slate-800 active:scale-[0.99]"
                >
                    Sign In
                </button>

            </form>

            <!-- Back -->
            <div class="text-center mt-6">
                <a
                    href="/"
                    class="text-sm font-medium text-slate-500 hover:text-slate-900 transition"
                >
                    ← Back to Home
                </a>
            </div>

        </div>

        <p class="text-center text-xs text-slate-500 mt-6">
            Secure administrator access
        </p>

    </div>

</body>
</html>
