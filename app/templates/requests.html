<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests | AI Operations Automation Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f6f8fc;
            color: #172033;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .page {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .title-area h1 {
            font-size: 28px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .title-area p {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            border: 1px solid #dbe2ec;
            border-radius: 10px;
            background: #ffffff;
            color: #344054;
            font-size: 14px;
            font-weight: 600;
            transition: .2s ease;
        }

        .back-link:hover {
            border-color: #b8c3d4;
            transform: translateY(-1px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, .04);
        }

        .stat-label {
            color: #667085;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: 750;
            color: #111827;
        }

        .toolbar {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, .04);
        }

        .toolbar-left {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1;
        }

        .search {
            min-width: 260px;
            flex: 1;
            max-width: 430px;
            position: relative;
        }

        .search input {
            width: 100%;
            height: 42px;
            border: 1px solid #d8dee8;
            border-radius: 9px;
            padding: 0 14px;
            outline: none;
            background: #fbfcfe;
            color: #111827;
        }

        .search input:focus {
            border-color: #8ca0c2;
            background: #ffffff;
        }

        select {
            height: 42px;
            border: 1px solid #d8dee8;
            border-radius: 9px;
            padding: 0 12px;
            background: #ffffff;
            color: #344054;
            outline: none;
            cursor: pointer;
        }

        .refresh-btn {
            height: 42px;
            padding: 0 16px;
            border: 1px solid #d8dee8;
            border-radius: 9px;
            background: #ffffff;
            color: #344054;
            font-weight: 650;
            cursor: pointer;
            transition: .2s ease;
        }

        .refresh-btn:hover {
            background: #f8fafc;
        }

        .table-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(15, 23, 42, .04);
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        thead {
            background: #f8fafc;
        }

        th {
            text-align: left;
            padding: 15px 18px;
            color: #667085;
            font-size: 12px;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: .04em;
            border-bottom: 1px solid #e5eaf1;
            white-space: nowrap;
        }

        td {
            padding: 16px 18px;
            border-bottom: 1px solid #edf0f5;
            font-size: 14px;
            color: #344054;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:hover {
            background: #fafbfc;
        }

        .request-id {
            font-weight: 700;
            color: #18243a;
        }

        .customer {
            font-weight: 650;
            color: #202b3c;
        }

        .email {
            color: #667085;
            font-size: 13px;
            margin-top: 3px;
        }

        .subject {
            max-width: 290px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .status-completed {
            background: #ecfdf3;
            color: #067647;
            border-color: #abefc6;
        }

        .status-pending,
        .status-pending_review,
        .status-processing {
            background: #fffaeb;
            color: #b54708;
            border-color: #fedf89;
        }

        .status-failed {
            background: #fef3f2;
            color: #b42318;
            border-color: #fecdca;
        }

        .status-default {
            background: #f2f4f7;
            color: #475467;
            border-color: #d0d5dd;
        }

        .priority-low {
            color: #067647;
        }

        .priority-medium {
            color: #b54708;
        }

        .priority-high {
            color: #c4320a;
        }

        .priority-critical {
            color: #b42318;
            font-weight: 800;
        }

        .view-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 34px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid #d0d5dd;
            background: #ffffff;
            color: #344054;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s ease;
        }

        .view-btn:hover {
            background: #f8fafc;
            border-color: #98a2b3;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #667085;
        }

        .empty strong {
            display: block;
            color: #344054;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #667085;
        }

        .error {
            margin: 18px;
            padding: 14px 16px;
            border-radius: 10px;
            background: #fef3f2;
            border: 1px solid #fecdca;
            color: #b42318;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .48);
            z-index: 1000;
            padding: 24px;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: min(760px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, .25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 20px 22px;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-header h2 {
            font-size: 19px;
        }

        .close-btn {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 8px;
            background: #f2f4f7;
            cursor: pointer;
            font-size: 18px;
            color: #475467;
        }

        .modal-body {
            padding: 22px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .detail-item {
            padding: 14px;
            border: 1px solid #eaecf0;
            border-radius: 10px;
            background: #fcfcfd;
        }

        .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: #667085;
            font-weight: 750;
            margin-bottom: 6px;
        }

        .detail-value {
            color: #1d2939;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .full {
            grid-column: 1 / -1;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 600px) {
            .page {
                padding: 16px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .toolbar {
                align-items: stretch;
            }

            .toolbar-left {
                flex-direction: column;
            }

            .search {
                max-width: none;
            }

            select,
            .refresh-btn {
                width: 100%;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="topbar">
        <div class="title-area">
            <h1>Business Requests</h1>
            <p>Monitor and manage requests processed by the automation system.</p>
        </div>

        <a href="/dashboard/" class="back-link">
            ← Dashboard
        </a>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Total Requests</div>
            <div class="stat-value" id="totalCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Completed</div>
            <div class="stat-value" id="completedCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Pending Review</div>
            <div class="stat-value" id="pendingCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Failed</div>
            <div class="stat-value" id="failedCount">0</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="toolbar-left">
            <div class="search">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search requests, customers, email..."
                    autocomplete="off"
                >
            </div>

            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="completed">Completed</option>
                <option value="pending_review">Pending Review</option>
                <option value="processing">Processing</option>
                <option value="failed">Failed</option>
            </select>

            <select id="priorityFilter">
                <option value="">All Priorities</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
                <option value="CRITICAL">Critical</option>
            </select>
        </div>

        <button
            type="button"
            class="refresh-btn"
            id="refreshBtn"
        >
            ↻ Refresh
        </button>
    </div>

    <div class="table-card">
        <div id="errorBox"></div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Request ID</th>
                        <th>Customer</th>
                        <th>Request</th>
                        <th>Intent</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="requestsBody">
                    <tr>
                        <td colspan="7" class="loading">
                            Loading requests...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div
    class="modal"
    id="detailsModal"
    aria-hidden="true"
>
    <div class="modal-card">

        <div class="modal-header">
            <h2>Request Details</h2>

            <button
                type="button"
                class="close-btn"
                id="closeModal"
                aria-label="Close"
            >
                ×
            </button>
        </div>

        <div class="modal-body">
            <div
                class="detail-grid"
                id="detailsContent"
            ></div>
        </div>

    </div>
</div>

<script>
(function () {

    "use strict";

    const state = {
        requests: []
    };

    const body = document.getElementById("requestsBody");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const priorityFilter = document.getElementById("priorityFilter");
    const refreshBtn = document.getElementById("refreshBtn");
    const errorBox = document.getElementById("errorBox");

    const totalCount = document.getElementById("totalCount");
    const completedCount = document.getElementById("completedCount");
    const pendingCount = document.getElementById("pendingCount");
    const failedCount = document.getElementById("failedCount");

    const modal = document.getElementById("detailsModal");
    const closeModal = document.getElementById("closeModal");
    const detailsContent = document.getElementById("detailsContent");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function normalizeStatus(status) {
        return String(status || "")
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "_");
    }

    function normalizePriority(priority) {
        return String(priority || "")
            .trim()
            .toUpperCase();
    }

    function statusClass(status) {
        const normalized = normalizeStatus(status);

        if (normalized === "completed") {
            return "status-completed";
        }

        if (
            normalized === "pending_review" ||
            normalized === "pending" ||
            normalized === "processing"
        ) {
            return "status-pending";
        }

        if (normalized === "failed") {
            return "status-failed";
        }

        return "status-default";
    }

    function formatStatus(status) {
        return String(status || "Unknown")
            .replace(/_/g, " ")
            .replace(/\b\w/g, function (char) {
                return char.toUpperCase();
            });
    }

    function priorityClass(priority) {
        const value = normalizePriority(priority);

        if (value === "LOW") {
            return "priority-low";
        }

        if (value === "MEDIUM") {
            return "priority-medium";
        }

        if (value === "HIGH") {
            return "priority-high";
        }

        if (value === "CRITICAL") {
            return "priority-critical";
        }

        return "";
    }

    function showError(message) {
        errorBox.innerHTML =
            '<div class="error">' +
            escapeHtml(message) +
            "</div>";
    }

    function clearError() {
        errorBox.innerHTML = "";
    }

    function getRequestId(item) {
        return (
            item.request_id ||
            item.id ||
            item.requestId ||
            ""
        );
    }

    function getCustomerName(item) {
        return (
            item.customer_name ||
            item.customer ||
            "Unknown Customer"
        );
    }

    function getCustomerEmail(item) {
        return (
            item.customer_email ||
            item.email ||
            ""
        );
    }

    function getRequestText(item) {
        return (
            item.input_text ||
            item.message ||
            item.subject ||
            "No request description"
        );
    }

    function getStatus(item) {
        return (
            item.status ||
            "unknown"
        );
    }

    function getPriority(item) {
        return (
            item.priority ||
            "MEDIUM"
        );
    }

    function getIntent(item) {
        return (
            item.intent ||
            "General Business Request"
        );
    }

    function updateStats() {
        const requests = state.requests;

        totalCount.textContent = requests.length;

        completedCount.textContent =
            requests.filter(function (item) {
                return normalizeStatus(getStatus(item)) === "completed";
            }).length;

        pendingCount.textContent =
            requests.filter(function (item) {
                const status = normalizeStatus(getStatus(item));

                return (
                    status === "pending" ||
                    status === "pending_review" ||
                    status === "processing"
                );
            }).length;

        failedCount.textContent =
            requests.filter(function (item) {
                return normalizeStatus(getStatus(item)) === "failed";
            }).length;
    }

    function filteredRequests() {

        const search = searchInput.value
            .trim()
            .toLowerCase();

        const selectedStatus =
            normalizeStatus(statusFilter.value);

        const selectedPriority =
            normalizePriority(priorityFilter.value);

        return state.requests.filter(function (item) {

            const status =
                normalizeStatus(getStatus(item));

            const priority =
                normalizePriority(getPriority(item));

            const searchable = [
                getRequestId(item),
                getCustomerName(item),
                getCustomerEmail(item),
                getRequestText(item),
                getIntent(item),
                getStatus(item),
                getPriority(item)
            ]
            .join(" ")
            .toLowerCase();

            const matchesSearch =
                !search ||
                searchable.includes(search);

            const matchesStatus =
                !selectedStatus ||
                status === selectedStatus;

            const matchesPriority =
                !selectedPriority ||
                priority === selectedPriority;

            return (
                matchesSearch &&
                matchesStatus &&
                matchesPriority
            );
        });
    }

    function renderRequests() {

        const requests = filteredRequests();

        if (!requests.length) {

            body.innerHTML =
                '<tr>' +
                    '<td colspan="7">' +
                        '<div class="empty">' +
                            '<strong>No requests found</strong>' +
                            '<span>There are no requests matching the current filters.</span>' +
                        '</div>' +
                    '</td>' +
                '</tr>';

            return;
        }

        body.innerHTML = requests.map(function (item) {

            const requestId =
                getRequestId(item);

            const customerName =
                getCustomerName(item);

            const email =
                getCustomerEmail(item);

            const text =
                getRequestText(item);

            const intent =
                getIntent(item);

            const priority =
                getPriority(item);

            const status =
                getStatus(item);

            return (
                "<tr>" +

                    "<td>" +
                        '<span class="request-id">' +
                            escapeHtml(requestId || "N/A") +
                        "</span>" +
                    "</td>" +

                    "<td>" +
                        '<div class="customer">' +
                            escapeHtml(customerName) +
                        "</div>" +
                        (
                            email
                                ? '<div class="email">' +
                                    escapeHtml(email) +
                                  "</div>"
                                : ""
                        ) +
                    "</td>" +

                    "<td>" +
                        '<div class="subject" title="' +
                            escapeHtml(text) +
                        '">' +
                            escapeHtml(text) +
                        "</div>" +
                    "</td>" +

                    "<td>" +
                        escapeHtml(intent) +
                    "</td>" +

                    "<td>" +
                        '<span class="' +
                            priorityClass(priority) +
                        '">' +
                            escapeHtml(
                                String(priority).toUpperCase()
                            ) +
                        "</span>" +
                    "</td>" +

                    "<td>" +
                        '<span class="badge ' +
                            statusClass(status) +
                        '">' +
                            escapeHtml(
                                formatStatus(status)
                            ) +
                        "</span>" +
                    "</td>" +

                    "<td>" +
                        '<button ' +
                            'type="button" ' +
                            'class="view-btn" ' +
                            'data-request-id="' +
                            escapeHtml(requestId) +
                        '">' +
                            "View" +
                        "</button>" +
                    "</td>" +

                "</tr>"
            );

        }).join("");
    }

    function normalizeApiResponse(data) {

        if (Array.isArray(data)) {
            return data;
        }

        if (!data || typeof data !== "object") {
            return [];
        }

        const possibleKeys = [
            "requests",
            "data",
            "items",
            "results"
        ];

        for (const key of possibleKeys) {

            if (Array.isArray(data[key])) {
                return data[key];
            }
        }

        return [];
    }

    async function loadRequests() {

        clearError();

        body.innerHTML =
            '<tr>' +
                '<td colspan="7" class="loading">' +
                    "Loading requests..." +
                "</td>" +
            "</tr>";

        refreshBtn.disabled = true;
        refreshBtn.textContent = "Refreshing...";

        try {

            const response =
                await fetch("/api/requests/", {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    },
                    credentials: "same-origin"
                });

            if (!response.ok) {

                throw new Error(
                    "Unable to load requests. Server returned " +
                    response.status +
                    "."
                );
            }

            const data =
                await response.json();

            state.requests =
                normalizeApiResponse(data);

            updateStats();
            renderRequests();

        } catch (error) {

            state.requests = [];

            updateStats();

            body.innerHTML =
                '<tr>' +
                    '<td colspan="7">' +
                        '<div class="empty">' +
                            '<strong>Unable to load requests</strong>' +
                            '<span>Please refresh the page and try again.</span>' +
                        '</div>' +
                    '</td>' +
                '</tr>';

            showError(
                error.message ||
                "Unable to load requests."
            );

        } finally {

            refreshBtn.disabled = false;
            refreshBtn.textContent = "↻ Refresh";
        }
    }

    function showDetails(request) {

        const requestId =
            getRequestId(request);

        const fields = [
            ["Request ID", requestId],
            ["Customer", getCustomerName(request)],
            ["Email", getCustomerEmail(request)],
            ["Intent", getIntent(request)],
            ["Priority", getPriority(request)],
            ["Status", formatStatus(getStatus(request))],
            ["Action Taken", request.action_taken || "N/A"],
            ["Confidence", request.confidence_score != null
                ? String(request.confidence_score)
                : "N/A"],
            ["Request", getRequestText(request)],
            ["AI Summary", request.ai_summary || "N/A"],
            ["Error", request.error_message || "None"]
        ];

        detailsContent.innerHTML =
            fields.map(function (field) {

                return (
                    '<div class="detail-item ' +
                    (
                        field[0] === "Request" ||
                        field[0] === "AI Summary" ||
                        field[0] === "Error"
                            ? "full"
                            : ""
                    ) +
                    '">' +

                        '<div class="detail-label">' +
                            escapeHtml(field[0]) +
                        "</div>" +

                        '<div class="detail-value">' +
                            escapeHtml(field[1] || "N/A") +
                        "</div>" +

                    "</div>"
                );

            }).join("");

        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");
    }

    function closeDetails() {
        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");
    }

    body.addEventListener("click", function (event) {

        const button =
            event.target.closest(
                ".view-btn"
            );

        if (!button) {
            return;
        }

        const requestId =
            button.getAttribute(
                "data-request-id"
            );

        const request =
            state.requests.find(function (item) {
                return String(
                    getRequestId(item)
                ) === String(requestId);
            });

        if (request) {
            showDetails(request);
        }
    });

    searchInput.addEventListener(
        "input",
        renderRequests
    );

    statusFilter.addEventListener(
        "change",
        renderRequests
    );

    priorityFilter.addEventListener(
        "change",
        renderRequests
    );

    refreshBtn.addEventListener(
        "click",
        loadRequests
    );

    closeModal.addEventListener(
        "click",
        closeDetails
    );

    modal.addEventListener(
        "click",
        function (event) {
            if (event.target === modal) {
                closeDetails();
            }
        }
    );

    document.addEventListener(
        "keydown",
        function (event) {
            if (event.key === "Escape") {
                closeDetails();
            }
        }
    );

    loadRequests();

})();
</script>

</body>
</html>
